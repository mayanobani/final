name: CI/CD - Skills Utilization

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./code
          file: ./code/Dockerfile
          push: true
          tags: |
            ghcr.io/mayanobani/final:latest
            ghcr.io/mayanobani/final:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve secrets from Vault and build .env
        run: |
          bash /home/aau/Desktop/Skills_Utilization/vault-script.sh

      - name: Pull latest image and redeploy
        run: |
          cd /home/aau/Desktop/Skills_Utilization
          docker compose down
          docker container prune -f
          ./vault-script.sh
          docker compose up -d
          docker compose up -d
