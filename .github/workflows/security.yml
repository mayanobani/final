name: CI/CD - Skills Utilization

on:
  push:
    branches:
      - main

jobs:
  trufflehog-scan:
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog secret scan
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:latest \
            filesystem /repo --only-verified --json > trufflehog-report.json || true
          cat trufflehog-report.json

      - name: Upload TruffleHog report
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: trufflehog-report.json

  hadolint-scan:
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        continue-on-error: true
        run: |
          docker run --rm -i hadolint/hadolint < ./code/Dockerfile > hadolint-report.txt || true
          cat hadolint-report.txt

      - name: Upload Hadolint report
        uses: actions/upload-artifact@v4
        with:
          name: hadolint-report
          path: hadolint-report.txt

  bandit-scan:
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit scan
        continue-on-error: true
        run: |
          bandit -r ./code -ll -f txt -o bandit-report.txt || true
          cat bandit-report.txt

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

  collect-reports:
    needs: [trufflehog-scan, hadolint-scan, bandit-scan]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Combine into one file
        run: |
          mkdir -p combined
          {
            echo "===== TRUFFLEHOG REPORT ====="
            cat all-reports/trufflehog-report/trufflehog-report.json 2>/dev/null || echo "No report found"
            echo ""
            echo "===== HADOLINT REPORT ====="
            cat all-reports/hadolint-report/hadolint-report.txt 2>/dev/null || echo "No report found"
            echo ""
            echo "===== BANDIT REPORT ====="
            cat all-reports/bandit-report/bandit-report.txt 2>/dev/null || echo "No report found"
          } > combined/full-scan-report.txt

      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: full-scan-report
          path: combined/full-scan-report.txt

  build-and-push:
    needs: collect-reports
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./code
          file: ./code/Dockerfile
          push: true
          tags: |
            ghcr.io/mayanobani/final:latest
            ghcr.io/mayanobani/final:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve secrets from Vault and build .env
        run: |
          bash /home/aau/Desktop/Skills_Utilization/vault-script.sh

      - name: Pull latest image and redeploy
        run: |
          cd /home/aau/Desktop/Skills_Utilization
          docker compose pull
          docker compose up -d
          docker image prune -f
